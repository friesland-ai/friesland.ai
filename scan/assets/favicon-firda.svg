<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A5757" />
      <stop offset="60%" stop-color="#3A5757" />
      <stop offset="100%" stop-color="#95CDEA" />
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A5757" />
      <stop offset="100%" stop-color="#263A3A" />
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Square -->
  <rect width="100" height="100" rx="24" fill="#3A5757" />
  <rect x="3" y="3" width="94" height="94" rx="21" fill="#FFFFFF" opacity="0.08" />
  
  <!-- Connecting Neural Grid Nodes -->
  <circle cx="28" cy="34" r="3.5" fill="#95CDEA" opacity="0.9" />
  <circle cx="72" cy="34" r="3.5" fill="#95CDEA" opacity="0.9" />
  <circle cx="50" cy="20" r="4.5" fill="#95CDEA" />
